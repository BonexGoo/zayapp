<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=0"/>

    <title>ZAYAPP</title>
    <meta name="description" content="ZayApp 런타임 앱사이트 — 웹에서 앱을 실행하고 PC용 ZayApp과 ZayPro를 다운로드하세요.">
    <style>
      :root {
        --runtime-bar-height: 60px;
        --pc-download-width: clamp(230px, 27vw, 300px);
        --runtime-bottom-inset: env(safe-area-inset-bottom, 0px);
        --runtime-bar-total: calc(var(--runtime-bar-height) + var(--runtime-bottom-inset));
      }
            /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #000; color: #fff; }
      /* Keep browser touch gestures and tap feedback out of the Qt surface. */
      html, body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #screen, #screen * {
        -webkit-tap-highlight-color: transparent !important;
      }
      #screen {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Prefer dynamic viewport units when available; fallback to 100vh. */
      #screen {
        background: #000;
        width: 100%;
        height: calc(100vh - var(--runtime-bar-total));
        height: calc(100dvh - var(--runtime-bar-total));
        position: fixed;
        top: 0;
        left: 0;
        box-sizing: border-box;
      }
      #qtspinner {
        background: #000;
        width: 100%;
        height: calc(100vh - var(--runtime-bar-total));
        height: calc(100dvh - var(--runtime-bar-total));
        position: fixed;
        top: 0;
        left: 0;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* Runtime app site: app + WASM. Reserve the bar before Qt measures #screen. */
      #runtime-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        display: flex;
        align-items: stretch;
        height: var(--runtime-bar-total);
        padding: 0 env(safe-area-inset-right, 0px) var(--runtime-bottom-inset) env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        background: #f7f9fd;
        box-shadow: none;
        color: #182334;
        font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-user-select: auto;
        user-select: auto;
        touch-action: manipulation;
      }
      #runtime-banner {
        position: relative;
        flex: 1 1 0%;
        min-width: 0;
        height: var(--runtime-bar-height);
        overflow: hidden;
        background-color: #061726;
      }
      /* A single GIF scales to the bar height; its own right edge fades out. */
      .runtime-banner-image {
        display: block;
        width: auto;
        height: 100%;
        max-width: none;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 180px), transparent 100%);
        mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 180px), transparent 100%);
      }
      /* Also soften the clipped edge when the available width is narrower. */
      #runtime-banner::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(180px, 28%);
        background: linear-gradient(to right, rgba(6, 23, 38, 0), #061726);
        pointer-events: none;
      }
      /* Match the Solutions app site's quiet surface, type, and blue accent. */
      #pc-downloads {
        flex: 0 0 var(--pc-download-width);
        width: var(--pc-download-width);
        height: var(--runtime-bar-height);
        box-sizing: border-box;
        border-left: 1px solid #dfe5ee;
        padding: 5px 10px;
        background: #f7f9fd;
      }
      #pc-download-title {
        margin: 0 0 4px;
        color: #5d6879;
        font-size: .8125rem;
        font-weight: 650;
        line-height: 16px;
        letter-spacing: -.015em;
        text-align: center;
        white-space: nowrap;
      }
      .pc-download-buttons {
        display: flex;
        align-items: stretch;
        gap: 8px;
        height: 30px;
      }
      .pc-download-button {
        flex: 1 1 0%;
        min-width: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #365bce;
        box-shadow: 0 2px 6px #25459a18;
        color: #fff;
        font-size: .875rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -.02em;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      .pc-download-button.zaypro {
        background: #eef3ff;
        border-color: #d6e0f6;
        box-shadow: none;
        color: #365bce;
      }
      .pc-download-button:hover {
        background: #2447ae;
        box-shadow: 0 3px 9px #25459a28;
      }
      .pc-download-button.zaypro:hover {
        background: #e2eaff;
        border-color: #b5c6ef;
        box-shadow: none;
      }
      .pc-download-button:active { background: #1e3e9c; }
      .pc-download-button.zaypro:active { background: #d7e2fc; }
      .pc-download-button:focus-visible { outline: 2px solid #365bce; outline-offset: 2px; }
      .pc-download-version {
        color: #e5ecff;
        font-size: .75rem;
        font-weight: 550;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .zaypro .pc-download-version { color: #5e75b2; }

      /* Adapt download controls to viewport width, without clipping version labels. */
      @media (orientation: landscape) and (max-width: 760px) {
        :root { --pc-download-width: clamp(180px, 42vw, 280px); }
        #pc-downloads { padding-inline: 6px; }
        .pc-download-buttons { gap: 4px; }
        .pc-download-button { gap: 3px; font-size: clamp(10px, 1.75vw, 14px); }
        .pc-download-version { font-size: clamp(9px, 1.5vw, 12px); }
      }

      /* Portrait phones: full-width advertising above full-width PC downloads. */
      @media (orientation: portrait) and (max-width: 900px) {
        :root { --runtime-bar-height: 120px; --pc-download-width: 100%; }
        #runtime-bar { flex-direction: column; }
        #runtime-banner {
          flex: 0 0 60px;
          width: 100%;
          height: 60px;
        }
        .runtime-banner-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: left center;
          -webkit-mask-image: none;
          mask-image: none;
        }
        #runtime-banner::after { width: min(90px, 14%); }
        #pc-downloads {
          flex: 0 0 60px;
          width: 100%;
          height: 60px;
          border-left: 0;
          border-top: 1px solid #dfe5ee;
          padding: 4px 12px 5px;
        }
        #pc-download-title { margin-bottom: 3px; line-height: 16px; }
        .pc-download-buttons { height: 31px; }
      }

      /* Keep the group usable in embedded views narrower than the download area. */
      @media (max-width: 420px) and (orientation: landscape) {
        :root { --pc-download-width: 52vw; }
        .pc-download-buttons { gap: 2px; }
        .pc-download-button { flex-direction: column; gap: 1px; font-size: 10px; }
        .pc-download-version { font-size: 9px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .runtime-banner-image { display: none; }
        #runtime-banner::before {
          content: "인천아트쇼 2026 · 송도컨벤시아";
          display: block;
          padding-left: 12px;
          line-height: var(--runtime-bar-height);
          color: #d9f1ff;
          font-size: 18px;
          font-weight: 600;
        }
        .pc-download-button { transition: none; }
      }
    </style>
  </head>
  <body onload="init()" style="padding:0; margin:0; overflow:hidden;">
    <figure style="margin:0; display:flex; align-items:center; justify-content:center; z-index:9999;" id="qtspinner">
      <center style="margin:0; line-height:150%; text-align:center;">
        <img src="logo_zayapp.svg" width="300" height="300" style="display:block; margin:0 auto;"></img>
        <strong>ZAYAPP</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <!-- Banner visual references: official Incheon Art Show 2026, Contact Heritage.
         https://www.iartshow.co.kr/242
         Artwork photography: Sohn Dae-Hyun (najeon lacquer jars),
         Huh Myoungwook (Between), Kim Sanggon (red-glazed jar).
         Event schedule follows the supplied INAS 2026 poster. -->
    <footer id="runtime-bar" aria-label="런타임 앱사이트 배너 및 PC 다운로드" lang="ko">
      <div id="runtime-banner" role="img" aria-label="인천아트쇼 2026 · 11.19–22 · 송도컨벤시아">
        <img class="runtime-banner-image" src="banner.gif?v=incheon-artshow-2026-motion" width="2400" height="120" alt="" aria-hidden="true" draggable="false">
      </div>
      <section id="pc-downloads" aria-labelledby="pc-download-title">
        <h2 id="pc-download-title">PC버전 Download</h2>
        <div class="pc-download-buttons">
          <a class="pc-download-button zayapp" id="download-zayapp"
             href="https://github.com/BonexGoo/zayapp/releases/latest"
             target="_blank" rel="noopener noreferrer"
             aria-label="ZayApp 최신 PC 버전 확인" title="ZayApp 최신 릴리즈 페이지">
            <span>ZayApp</span><span class="pc-download-version">…</span>
          </a>
          <a class="pc-download-button zaypro" id="download-zaypro"
             href="https://github.com/BonexGoo/zaypro/releases/latest"
             target="_blank" rel="noopener noreferrer"
             aria-label="ZayPro 최신 PC 버전 확인" title="ZayPro 최신 릴리즈 페이지">
            <span>ZayPro</span><span class="pc-download-version">…</span>
          </a>
        </div>
      </section>
    </footer>

    <script>
      // Runtime AppSite: resolve the newest *published stable* GitHub Release.
      // The release asset URL comes from GitHub itself, so changing ZIP filenames
      // or version numbers never requires changing this HTML.
      async function updateLatestDownload(repo, elementId, appName) {
        const button = document.getElementById(elementId);
        if (!button) return;
        const version = button.querySelector('.pc-download-version');
        const releasesUrl = `https://github.com/BonexGoo/${repo}/releases/latest`;
        button.href = releasesUrl; // safe fallback if the API is unavailable
        try {
          const response = await fetch(`https://api.github.com/repos/BonexGoo/${repo}/releases/latest`, {
            headers: { Accept: 'application/vnd.github+json' },
            cache: 'no-store'
          });
          if (!response.ok) throw new Error(`GitHub API HTTP ${response.status}`);
          const release = await response.json();
          if (!release || release.draft || release.prerelease || !release.tag_name) {
            throw new Error('No stable release');
          }
          const v = String(release.tag_name).replace(/^v(?=\d)/i, '');
          // Only choose a release attachment matching the intended Windows ZIP.
          // Ignore automatic GitHub source-code ZIPs and unrelated assets.
          const assets = Array.isArray(release.assets) ? release.assets : [];
          const zips = assets.filter(a =>
            a && typeof a.name === 'string' &&
            typeof a.browser_download_url === 'string' &&
            /^https:\/\/github\.com\/BonexGoo\//i.test(a.browser_download_url) &&
            /\.zip$/i.test(a.name) &&
            a.name.toLowerCase().startsWith(repo.toLowerCase() + '_') &&
            !/(source|src|symbols|debug)/i.test(a.name)
          );
          const asset = zips.find(a => /(win|windows|x64|amd64)/i.test(a.name)) || zips[0];
          version.textContent = v;
          if (asset) {
            button.href = asset.browser_download_url;
            button.title = `${appName} ${v} · Windows ZIP 다운로드`;
            button.setAttribute('aria-label', `${appName} ${v} 최신 PC 버전 ZIP 다운로드`);
          } else {
            button.href = release.html_url || releasesUrl;
            button.title = `${appName} ${v} · 다운로드 파일 확인`;
            button.setAttribute('aria-label', `${appName} ${v} 릴리즈 페이지 열기`);
          }
        } catch (error) {
          // The browser may be offline, rate-limited, or temporarily blocked.
          // Never display a stale fixed version or link to an obsolete ZIP.
          console.warn(`${appName} release check failed:`, error);
          version.textContent = '—';
          button.title = `${appName} 최신 릴리즈 페이지`;
          button.setAttribute('aria-label', `${appName} 최신 릴리즈 페이지 열기`);
        }
      }
      updateLatestDownload('zayapp', 'download-zayapp', 'ZayApp');
      updateLatestDownload('zaypro', 'download-zaypro', 'ZayPro');
    </script>

    <script type="text/javascript">
        // Qt 6.8 creates its own open Shadow DOM below the screen container.
        // Install the touch feedback rules there, before the surface is shown.
        function installQtTouchStyle(screen)
        {
            for (const host of screen.querySelectorAll('#qt-shadow-container')) {
                const root = host.shadowRoot;
                if (!root || root.getElementById('zayapp-touch-style')) continue;

                const style = document.createElement('style');
                style.id = 'zayapp-touch-style';
                style.textContent = `
                    :host, .qt-screen, .qt-screen * {
                        -webkit-tap-highlight-color: transparent !important;
                    }
                    .qt-screen, canvas.qt-window-content {
                        touch-action: none;
                    }
                    canvas.qt-window-content {
                        -webkit-touch-callout: none;
                        -webkit-user-select: none !important;
                        user-select: none !important;
                    }
                    canvas.qt-window-content::selection {
                        background: transparent;
                    }
                `;
                root.appendChild(style);
            }
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const touchStyleObserver = new MutationObserver(() => installQtTouchStyle(screen));
            touchStyleObserver.observe(screen, { childList: true, subtree: true });
            installQtTouchStyle(screen);

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (ui === spinner) spinner.style.display = 'flex';
                ui.style.display = 'flex';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => {
                            installQtTouchStyle(screen);
                            showUi(screen);
                        },
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.zayapp_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="zayapp.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
