<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=0"/>

    <title>ZAYAPP</title>
    <style>
            /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #000; color: #fff; }
      /* Keep browser touch gestures and tap feedback out of the Qt surface. */
      html, body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #screen, #screen * {
        -webkit-tap-highlight-color: transparent !important;
      }
      #screen {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Prefer dynamic viewport units when available; fallback to 100vh. */
      #screen {
        background: #000;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: fixed;
        inset: 0;
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
      #qtspinner {
        background: #000;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: fixed;
        inset: 0;
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
        overflow: hidden;
      }
    </style>
  </head>
  <body onload="init()" style="padding:0; margin:0; overflow:hidden;">
    <figure style="margin:0; display:flex; align-items:center; justify-content:center; z-index:9999;" id="qtspinner">
      <center style="margin:0; line-height:150%; text-align:center;">
        <img src="logo_zayapp.svg" width="300" height="300" style="display:block; margin:0 auto;"></img>
        <strong>ZAYAPP</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        // Qt 6.8 creates its own open Shadow DOM below the screen container.
        // Install the touch feedback rules there, before the surface is shown.
        function installQtTouchStyle(screen)
        {
            for (const host of screen.querySelectorAll('#qt-shadow-container')) {
                const root = host.shadowRoot;
                if (!root || root.getElementById('zayapp-touch-style')) continue;

                const style = document.createElement('style');
                style.id = 'zayapp-touch-style';
                style.textContent = `
                    :host, .qt-screen, .qt-screen * {
                        -webkit-tap-highlight-color: transparent !important;
                    }
                    .qt-screen, canvas.qt-window-content {
                        touch-action: none;
                    }
                    canvas.qt-window-content {
                        -webkit-touch-callout: none;
                        -webkit-user-select: none !important;
                        user-select: none !important;
                    }
                    canvas.qt-window-content::selection {
                        background: transparent;
                    }
                `;
                root.appendChild(style);
            }
        }

        // Optional A/B test for the browser's editable Canvas behavior.
        // Normal launches keep Qt's original contentEditable and event handling.
        const touchTestParams = new URLSearchParams(location.search);
        const touchTestNoEdit = touchTestParams.get('touchtest') === 'noedit';
        const touchDiagEnabled = touchTestParams.get('touchdiag') === '1';
        const touchTestRoots = new WeakSet();
        const touchDiagLines = [];
        let touchDiagPanel = null;

        function describeTouchNode(node) {
            if (!node || !node.tagName) return '-';
            return node.tagName.toLowerCase() + (node.id ? '#' + node.id : '')
                + (node.classList.length ? '.' + Array.from(node.classList).join('.') : '');
        }

        function installTouchFocusTest(screen) {
            if (!touchTestNoEdit && !touchDiagEnabled) return;
            for (const host of screen.querySelectorAll('#qt-shadow-container')) {
                const root = host.shadowRoot;
                if (!root || touchTestRoots.has(root)) continue;
                touchTestRoots.add(root);
                if (touchTestNoEdit) {
                    const apply = () => {
                        for (const canvas of root.querySelectorAll('canvas.qt-window-content')) {
                            if (canvas.contentEditable !== 'false') {
                                canvas.contentEditable = 'false';
                                // Preserve keyboard focusability independently of editability.
                                if (canvas.tabIndex < 0) canvas.tabIndex = 0;
                            }
                        }
                    };
                    new MutationObserver(apply).observe(root, {
                        childList: true, subtree: true, attributes: true,
                        attributeFilter: ['contenteditable']
                    });
                    apply();
                }
            }
        }

        function installTouchDiagnostics(screen) {
            if (!touchDiagEnabled) return;
            touchDiagPanel = document.createElement('pre');
            touchDiagPanel.style.cssText = 'position:fixed;left:0;top:0;max-width:100%;'
                + 'z-index:2147483647;pointer-events:none;margin:0;padding:4px;'
                + 'background:rgba(0,0,0,.72);color:#fff;font:10px/1.2 monospace;'
                + 'white-space:pre-wrap;overflow-wrap:anywhere;';
            document.body.appendChild(touchDiagPanel);
            touchDiagPanel.textContent = 'Touch test: ' + (touchTestNoEdit ? 'noedit' : 'original');
            function activeNode() {
                let el = document.activeElement;
                while (el && el.shadowRoot && el.shadowRoot.activeElement) {
                    el = el.shadowRoot.activeElement;
                }
                return el;
            }
            function record(e) {
                const path = e.composedPath();
                const target = path[0];
                const inQt = path.includes(screen);
                if (!inQt && !['focusin', 'focusout'].includes(e.type)) return;
                const style = target instanceof Element ? getComputedStyle(target) : null;
                const type = e.type;
                const pointerId = e.pointerId;
                const targetName = describeTouchNode(target);
                const tap = style ? style.webkitTapHighlightColor : '-';
                const editable = target instanceof HTMLElement ? target.isContentEditable : false;
                // Read defaultPrevented after Qt's event listeners have run.
                setTimeout(() => {
                    const focus = activeNode();
                    const selection = document.getSelection();
                    const selected = selection && !selection.isCollapsed ? 'range' : 'none';
                    const line = type + (pointerId === undefined ? '' : '#' + pointerId)
                        + ' prevent=' + Number(e.defaultPrevented) + ' target=' + targetName
                        + ' edit=' + Number(editable) + ' tap=' + tap;
                    touchDiagLines.push(line);
                    if (touchDiagLines.length > 5) touchDiagLines.shift();
                    touchDiagPanel.textContent = 'Touch test: ' + (touchTestNoEdit ? 'noedit' : 'original')
                        + '\nfocus=' + describeTouchNode(focus) + ' selection=' + selected
                        + '\n' + touchDiagLines.join('\n');
                    console.log('[ZayTouch]', line, 'focus=', describeTouchNode(focus), 'selection=', selected);
                }, 0);
            }
            for (const type of ['pointerdown','pointerup','pointercancel','gotpointercapture',
                                'lostpointercapture','focusin','focusout']) {
                document.addEventListener(type, record, {capture: true, passive: true});
            }
        }

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const touchStyleObserver = new MutationObserver(() => {
                installQtTouchStyle(screen);
                installTouchFocusTest(screen);
            });
            touchStyleObserver.observe(screen, { childList: true, subtree: true });
            installQtTouchStyle(screen);
            installTouchFocusTest(screen);
            installTouchDiagnostics(screen);

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (ui === spinner) spinner.style.display = 'flex';
                ui.style.display = 'flex';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => {
                            installQtTouchStyle(screen);
                            installTouchFocusTest(screen);
                            showUi(screen);
                        },
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.zayapp_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="zayapp.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
