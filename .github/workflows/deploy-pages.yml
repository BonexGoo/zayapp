name: Deploy ZayApp to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing zayapp.wasm (for example, 1.2.3)'
        required: true
        type: string
        default: '1.2.3'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site files
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download WASM from Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "zayapp.wasm" --dir docs --clobber
          test -s docs/index.html
          test -s docs/zayapp.js
          test -s docs/zayapp.wasm
          ls -lh docs/zayapp.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
