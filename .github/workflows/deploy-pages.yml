name: Deploy ZayApp to Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing zayapp.wasm"
        required: true
        default: "1.0.7"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout website files
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download WASM from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/zayapp.js
          test -s docs/qtloader.js

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "zayapp.wasm" \
            --dir docs \
            --clobber

      - name: Check downloaded WASM
        shell: bash
        run: |
          python3 - <<'CHECK'
          from pathlib import Path

          path = Path("docs/zayapp.wasm")
          with path.open("rb") as stream:
              header = stream.read(8)

          if header != b"\x00asm\x01\x00\x00\x00":
              raise SystemExit("Downloaded file is not a WebAssembly binary.")

          print(f"WASM size: {path.stat().st_size:,} bytes")
          CHECK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
